# fly.toml — config for fly.io free deploy of Nunta Mea backend
# Created for cybermediabacau project. Free tier: 3 shared-cpu-1x@256mb VMs.

app = "nuntamea-api"
primary_region = "fra"  # Frankfurt — lowest latency for Romania

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_NAME = "nuntamea_db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # NEVER hibernate (we want always-on)
  auto_start_machines = true
  min_machines_running = 1        # Keep at least 1 alive

  [[http_service.checks]]
    interval = "30s"
    grace_period = "10s"
    method = "GET"
    path = "/api/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
